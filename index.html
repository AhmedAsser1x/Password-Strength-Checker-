<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Strength Checker</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e);
  background-size: 400% 400%;
  animation: bg 10s ease infinite;
}

@keyframes bg {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

.box {
  width: 340px;
  padding: 30px;
  border-radius: 15px;

  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);

  text-align: center;
  color: white;
}

h2 {
  margin-bottom: 15px;
  letter-spacing: 1px;
}

.input-box {
  position: relative;
  width: 100%;
  margin-top: 10px;
}

.input-box input {
  width: 100%;
  padding: 12px;
  padding-right: 40px;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 14px;
}

#toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 18px;
  opacity: 0.7;
  transition: 0.2s;
  user-select: none;
}

#toggle:hover {
  opacity: 1;
}

.bar {
  width: 100%;
  height: 10px;
  background: rgba(255,255,255,0.15);
  border-radius: 10px;
  margin-top: 15px;
  overflow: hidden;
}

#progress {
  height: 100%;
  width: 0%;
  background: red;
  transition: 0.4s;
  border-radius: 10px;
  box-shadow: 0 0 10px red;
}

.result {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
}

.weak { color: #ff4d4d; }
.medium { color: #ffb84d; }
.strong { color: #4dff88; }
</style>
</head>

<body>

<div class="box">
  <h2>Password Strength</h2>

  <div class="input-box">
    <input type="password" id="password" placeholder="Enter your password">
    <span id="toggle">👁️</span>
  </div>

  <div class="bar">
    <div id="progress"></div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
const password = document.getElementById("password");
const result = document.getElementById("result");
const progress = document.getElementById("progress");
const toggle = document.getElementById("toggle");

/* SHOW / HIDE PASSWORD */
toggle.addEventListener("click", function () {
  if (password.type === "password") {
    password.type = "text";
    toggle.textContent = "🙈";
  } else {
    password.type = "password";
    toggle.textContent = "👁️";
  }
});

/* STRENGTH CHECKER */
password.addEventListener("input", function () {
  const value = password.value;

  let strength = 0;

  if (value.length >= 6) strength++;
  if (value.length >= 10) strength++;
  if (/[A-Z]/.test(value)) strength++;
  if (/[0-9]/.test(value)) strength++;
  if (/[^A-Za-z0-9]/.test(value)) strength++;

  let percent = (strength / 5) * 100;
  progress.style.width = percent + "%";

  if (value.length === 0) {
    result.textContent = "";
    progress.style.width = "0%";
  }
  else if (strength <= 2) {
    result.textContent = "Weak";
    result.className = "result weak";
    progress.style.background = "#ff4d4d";
    progress.style.boxShadow = "0 0 10px #ff4d4d";
  }
  else if (strength <= 4) {
    result.textContent = "Medium";
    result.className = "result medium";
    progress.style.background = "#ffb84d";
    progress.style.boxShadow = "0 0 10px #ffb84d";
  }
  else {
    result.textContent = "Strong";
    result.className = "result strong";
    progress.style.background = "#4dff88";
    progress.style.boxShadow = "0 0 10px #4dff88";
  }
});
</script>

</body>
</html>
